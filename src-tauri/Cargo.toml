[package]
name = "fine-tune"
version = "0.1.0"
description = "Fine-Tune Studio — Qdrant → Teacher → Dataset → LoRA pipeline orchestrator"
authors = ["Zrald"]
edition = "2021"
rust-version = "1.75"
# Two binaries now exist (desktop `fine-tune` + headless `fine-tune-server`).
# `tauri dev` runs a bare `cargo run`, which is ambiguous with >1 binary — pin
# the desktop app as the default so `tauri dev`/`tauri build` keep working.
default-run = "fine-tune"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-fs = "2.0"
tauri-plugin-shell = "2.0"

# async + transport
tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream", "gzip", "brotli", "deflate", "multipart"] }
futures = "0.3"
async-trait = "0.1"

# SSH (pure-rust)
russh = "0.45"
russh-keys = "0.45"
russh-sftp = "2.0"

# serde / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# misc
thiserror = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1.1", features = ["serde"] }
dirs = "5"
base64 = "0.22"
once_cell = "1"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"
uuid = { version = "1", features = ["v4", "v5", "serde"] }
sha2 = "0.10"

# pdf parsing for knowledge-base ingestion. Pure-rust; fails on scanned PDFs
# (yields empty text), which we surface to the user as a per-file error.
pdf-extract = "0.7"
docx-lite = "0.2"

# headless VPS server (robot intake + dashboard REST API). Only used by the
# `fine-tune-server` binary; the desktop app does not link the HTTP server.
axum = { version = "0.7", features = ["json"] }
tower-http = { version = "0.5", features = ["cors"] }

[lib]
name = "fine_tune"
path = "src/lib.rs"

# Desktop Tauri app (default binary).
[[bin]]
name = "fine-tune"
path = "src/main.rs"

# Headless VPS server: robot capture intake + dashboard API. Reuses the lib.
[[bin]]
name = "fine-tune-server"
path = "src/bin/server.rs"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
